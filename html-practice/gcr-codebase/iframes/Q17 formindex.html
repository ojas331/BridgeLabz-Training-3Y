<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>
<body>

    <h1>Simple Form</h1>

    <form action="result.html" target="resultFrame">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- Result page will load inside this iframe -->
    <iframe
        src=""
        name="resultFrame"
        width="80%"
        height="200"
        title="Form Result">
    </iframe>

</body>
</html>
