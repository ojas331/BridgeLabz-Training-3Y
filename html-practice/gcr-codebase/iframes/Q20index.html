<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Title defines the name shown in the browser tab -->
    <title>Complete Head Elements</title>

    <!-- Charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Description provides information about the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements">

    <!-- Author identifies the creator of the webpage -->
    <meta name="author" content="Ojas Saraswat">

    <!-- Base sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Link connects external resources such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Empty style element for CSS -->
    <style>
    </style>

    <!-- Empty script element for JavaScript -->
    <script>
    </script>

</head>
<body>

    <h1>Important HTML Head Elements</h1>

    <p>This page demonstrates important elements used inside the head section.</p>

</body>
</html>
