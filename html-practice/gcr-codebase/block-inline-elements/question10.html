<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection</title>
</head>
<body>

    <h1>Travel Destination Selection</h1>

    <!-- Country -->
    <label for="country">Country:</label>
    <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="japan">Japan</option>
        <option value="france">France</option>
    </select>

    <br><br>

    <!-- State -->
    <label for="state">State:</label>
    <select id="state" name="state">
        <option value="uttar-pradesh" selected>Uttar Pradesh</option>
        <option value="delhi">Delhi</option>
        <option value="maharashtra">Maharashtra</option>
    </select>

    <br><br>

    <!-- City -->
    <label for="city">City:</label>
    <select id="city" name="city">
        <option value="mathura" selected>Mathura</option>
        <option value="agra">Agra</option>
        <option value="lucknow">Lucknow</option>
    </select>

    <br><br>

    <!-- Favorite Tourist Place -->
    <label for="tourist-place">Favorite Tourist Place:</label>
    <select id="tourist-place" name="tourist-place">
        <option value="taj-mahal" selected>Taj Mahal</option>
        <option value="goa">Goa</option>
        <option value="manali">Manali</option>
    </select>

    <!-- Summary -->
    <p>
        My selected country is India, state is Uttar Pradesh,
        city is Mathura, and favorite tourist place is Taj Mahal.
    </p>

</body>
</html>
