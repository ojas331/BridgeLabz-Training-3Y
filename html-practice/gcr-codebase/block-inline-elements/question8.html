 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report</title>
</head>
<body>

    <!-- School / University Name -->
    <h1>GLA University</h1>

    <!-- Student Marks Table -->
    <table border="1" title="Student Marks Report">

        <tr>
            <th rowspan="2">Student Name</th>
            <th colspan="5">Subjects</th>
            <th rowspan="2">Result</th>
        </tr>

        <tr>
            <th>Java</th>
            <th>DBMS</th>
            <th>Operating System</th>
            <th>Computer Networks</th>
            <th>Cloud Computing</th>
        </tr>

        <tr>
            <td>Ojas Saraswat</td>
            <td>78</td>
            <td>82</td>
            <td>75</td>
            <td>80</td>
            <td>85</td>
            <td>Pass</td>
        </tr>

        <!-- Total and Percentage -->
        <tr>
            <td colspan="5">Total and Percentage</td>
            <td colspan="2">400 / 500 = 80%</td>
        </tr>

    </table>

</body>
</html>
