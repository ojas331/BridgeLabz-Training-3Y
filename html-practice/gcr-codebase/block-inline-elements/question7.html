<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Schedule</title>
</head>
<body>

    <!-- Conference Heading -->
    <h1>Technology Conference 2026</h1>

    <!-- Conference Schedule Table -->
    <table border="1">

        <!-- Table Head -->
        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>
            <tr>
                <td>Morning</td>
                <td>10:00 AM</td>
                <td>Cloud Computing</td>
                <td>Rahul Sharma</td>
            </tr>

            <tr>
                <td>Afternoon</td>
                <td>2:00 PM</td>
                <td>DevOps</td>
                <td>Priya Gupta</td>
            </tr>

            <tr>
                <td>Evening</td>
                <td>5:00 PM</td>
                <td>Artificial Intelligence</td>
                <td>Amit Verma</td>
            </tr>
        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td colspan="4">Conference ends at 6:00 PM</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
